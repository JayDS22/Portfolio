<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <defs>
    <marker id="arrowhead-13" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="currentColor" opacity="0.55"/>
    </marker>
  </defs>
  <style>
    .frame      { stroke: currentColor; stroke-width: 2;   fill: none; }
    .edge       { stroke: currentColor; stroke-width: 2;   fill: none; opacity: 0.6; }
    .gate       { stroke: #b88746;      stroke-width: 2;   fill: none; stroke-dasharray: 6 6; }
    .gatelabel  { fill: #b88746;        font: 600 16px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.14em; }
    .mono       { fill: currentColor;   opacity: 0.85; font: 500 18px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.04em; }
    .accent-fill   { fill: #1d4ed8; }
    .bronze-stroke { stroke: #b88746; stroke-width: 2.4; fill: none; }
    .dim-stroke    { stroke: currentColor; stroke-width: 2; fill: none; opacity: 0.4; }
    .tier       { font: 700 22px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.1em; }
  </style>

  <!-- Browser window frame -->
  <rect class="frame" x="130" y="130" width="340" height="310" rx="10"/>
  <!-- Browser top bar -->
  <line class="frame" x1="130" y1="170" x2="470" y2="170"/>
  <circle cx="152" cy="150" r="4.5" fill="currentColor" opacity="0.55"/>
  <circle cx="168" cy="150" r="4.5" fill="currentColor" opacity="0.55"/>
  <circle cx="184" cy="150" r="4.5" fill="currentColor" opacity="0.55"/>
  <rect x="208" y="142" width="248" height="16" rx="4" fill="currentColor" opacity="0.08"/>

  <!-- Proposed actions (3 arrows out of the browser) -->
  <text class="mono" x="156" y="222">action.1</text>
  <path class="edge" d="M 300 215 L 580 215" marker-end="url(#arrowhead-13)"/>

  <text class="mono" x="156" y="298">action.2</text>
  <path class="edge" d="M 300 290 L 580 290" marker-end="url(#arrowhead-13)"/>

  <text class="mono" x="156" y="374">action.3</text>
  <path class="edge" d="M 300 366 L 580 366" marker-end="url(#arrowhead-13)"/>

  <!-- Classifier gate (vertical dashed column) -->
  <line class="gate" x1="600" y1="140" x2="600" y2="430"/>
  <text class="gatelabel" x="600" y="118" text-anchor="middle">CLASSIFIER GATE</text>

  <!-- Outcomes beyond gate -->
  <!-- PASS -->
  <circle cx="700" cy="215" r="18" class="accent-fill"/>
  <text class="tier" x="730" y="222" fill="#1d4ed8">PASS</text>

  <!-- CONFIRM -->
  <circle cx="700" cy="290" r="18" class="bronze-stroke"/>
  <text class="tier" x="730" y="297" fill="#b88746">CONFIRM</text>

  <!-- BLOCK -->
  <circle cx="700" cy="366" r="18" class="dim-stroke"/>
  <line x1="687" y1="353" x2="713" y2="379" class="dim-stroke"/>
  <text class="tier" x="730" y="373" fill="currentColor" opacity="0.55">BLOCK</text>
</svg>
