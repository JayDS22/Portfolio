<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <style>
    .node       { stroke: currentColor; stroke-width: 2;   fill: none; }
    .edge       { stroke: currentColor; stroke-width: 1.6; fill: none; opacity: 0.5; }
    .edge-dash  { stroke: currentColor; stroke-width: 1.6; fill: none; opacity: 0.5; stroke-dasharray: 3 5; }
    .bound      { stroke: #b88746;      stroke-width: 2;   fill: none; stroke-dasharray: 8 7; }
    .boundlabel { fill: #b88746; font: 600 18px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.14em; }
    .accent     { fill: #1d4ed8; }
    .accent-text{ fill: #ffffff; font: 700 24px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.08em; }
    .node-text  { fill: currentColor; font: 700 22px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.06em; }
    .caption    { fill: currentColor; opacity: 0.55; font: 500 16px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.1em; }
  </style>

  <!-- Orchestrator (filled accent) -->
  <circle cx="480" cy="130" r="52" class="accent"/>
  <text x="480" y="138" text-anchor="middle" class="accent-text">ORCH</text>

  <!-- Edges orch -> workers -->
  <path class="edge" d="M 448 165 L 310 250"/>
  <path class="edge" d="M 480 182 L 480 250"/>
  <path class="edge" d="M 512 165 L 650 250"/>

  <!-- Workers -->
  <circle cx="300" cy="290" r="44" class="node"/>
  <text x="300" y="298" text-anchor="middle" class="node-text">RET</text>
  <text x="300" y="356" text-anchor="middle" class="caption">retrieval</text>

  <circle cx="480" cy="290" r="44" class="node"/>
  <text x="480" y="298" text-anchor="middle" class="node-text">SQL</text>
  <text x="480" y="356" text-anchor="middle" class="caption">structured</text>

  <circle cx="660" cy="290" r="44" class="node"/>
  <text x="660" y="298" text-anchor="middle" class="node-text">OUT</text>
  <text x="660" y="356" text-anchor="middle" class="caption">output</text>

  <!-- RLS boundary -->
  <line class="bound" x1="200" y1="400" x2="760" y2="400"/>
  <text class="boundlabel" x="200" y="390">RLS BOUNDARY</text>

  <!-- Edges workers -> db (across boundary) -->
  <path class="edge-dash" d="M 300 334 L 450 460"/>
  <path class="edge-dash" d="M 480 334 L 480 460"/>
  <path class="edge-dash" d="M 660 334 L 510 460"/>

  <!-- Postgres cylinder -->
  <ellipse cx="480" cy="458" rx="74" ry="14" class="node"/>
  <path class="node" d="M 406 458 L 406 494 Q 406 508 480 508 Q 554 508 554 494 L 554 458"/>
  <text x="480" y="486" text-anchor="middle" class="node-text">PG</text>
</svg>
