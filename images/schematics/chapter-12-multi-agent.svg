<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none" role="img" aria-label="Multi-agent architecture schematic: orchestrator, three specialist workers, Postgres row-level security boundary">
  <style>
    .label { font: 500 11px "JetBrains Mono", ui-monospace, monospace; fill: currentColor; letter-spacing: 0.06em; }
    .big   { font: 600 22px "Space Grotesk", "Inter", sans-serif; fill: currentColor; letter-spacing: -0.01em; }
    .kick  { font: 500 10px "JetBrains Mono", ui-monospace, monospace; fill: currentColor; opacity: 0.6; letter-spacing: 0.14em; text-transform: uppercase; }
    .node  { stroke: currentColor; stroke-width: 1.5; fill: none; }
    .edge  { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.7; }
    .bound { stroke: #b88746; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
    .boundlabel { font: 600 10px "JetBrains Mono", ui-monospace, monospace; fill: #b88746; letter-spacing: 0.12em; }
    .accent-fill { fill: #1d4ed8; }
    .accent-fill-text { fill: #ffffff; font: 600 12px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.06em; }
    .node-text { fill: currentColor; font: 600 11px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.06em; }
  </style>

  <!-- Title block -->
  <text class="kick" x="40" y="56">AGENT SYSTEMS · OCT 2026</text>
  <text class="big"  x="40" y="92">Multi-Agent Reference</text>
  <text class="label" x="40" y="118" opacity="0.75">orchestrator · 3 workers · RLS boundary</text>

  <!-- Grid guide dots (very faint) -->
  <g opacity="0.08">
    <circle cx="440" cy="60"  r="1" fill="currentColor"/>
    <circle cx="520" cy="60"  r="1" fill="currentColor"/>
    <circle cx="600" cy="60"  r="1" fill="currentColor"/>
    <circle cx="680" cy="60"  r="1" fill="currentColor"/>
    <circle cx="440" cy="260" r="1" fill="currentColor"/>
    <circle cx="520" cy="260" r="1" fill="currentColor"/>
    <circle cx="600" cy="260" r="1" fill="currentColor"/>
    <circle cx="680" cy="260" r="1" fill="currentColor"/>
  </g>

  <!-- Orchestrator (filled accent) -->
  <circle cx="560" cy="78" r="28" class="accent-fill"/>
  <text x="560" y="83" text-anchor="middle" class="accent-fill-text">ORCH</text>

  <!-- Edges orch -> workers -->
  <path class="edge" d="M 544 97 L 450 148"/>
  <path class="edge" d="M 560 108 L 560 148"/>
  <path class="edge" d="M 576 97 L 670 148"/>

  <!-- Workers -->
  <circle cx="450" cy="168" r="22" class="node"/>
  <text x="450" y="172" text-anchor="middle" class="node-text">RET</text>

  <circle cx="560" cy="168" r="22" class="node"/>
  <text x="560" y="172" text-anchor="middle" class="node-text">SQL</text>

  <circle cx="670" cy="168" r="22" class="node"/>
  <text x="670" y="172" text-anchor="middle" class="node-text">OUT</text>

  <!-- RLS boundary -->
  <line class="bound" x1="400" y1="210" x2="720" y2="210"/>
  <text class="boundlabel" x="400" y="203">RLS BOUNDARY</text>

  <!-- Edges workers -> db (across boundary) -->
  <path class="edge" d="M 450 190 L 540 248" stroke-dasharray="2 3"/>
  <path class="edge" d="M 560 190 L 560 248" stroke-dasharray="2 3"/>
  <path class="edge" d="M 670 190 L 580 248" stroke-dasharray="2 3"/>

  <!-- Postgres cylinder -->
  <ellipse cx="560" cy="248" rx="46" ry="8" class="node"/>
  <path class="node" d="M 514 248 L 514 272 Q 514 280 560 280 Q 606 280 606 272 L 606 248"/>
  <text x="560" y="266" text-anchor="middle" class="node-text">PG</text>
</svg>
