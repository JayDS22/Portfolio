<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <style>
    .shield       { stroke: currentColor; stroke-width: 2.4; fill: none; }
    .shield-fill  { stroke: #1d4ed8; stroke-width: 2.6; fill: #1d4ed8; fill-opacity: 0.07; }
    .shieldlabel  { fill: currentColor; font: 700 24px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.1em; }
    .shieldlabel-accent { fill: #1d4ed8; font: 700 24px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.1em; }
    .motif        { stroke: currentColor; stroke-width: 2; fill: none; opacity: 0.85; }
    .motif-accent { stroke: #1d4ed8; stroke-width: 2.4; fill: none; }
    .cut          { stroke: #b88746; stroke-width: 2.4; stroke-dasharray: 5 5; }
    .drop         { fill: #1d4ed8; }
    .tally        { stroke: currentColor; stroke-width: 2; fill: none; opacity: 0.55; }
    .tally-text   { fill: currentColor; opacity: 0.65; font: 500 16px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.08em; }
    .arg          { fill: #1d4ed8; font: 700 11px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.06em; }
    .motif-dot    { fill: currentColor; opacity: 0.85; }
  </style>

  <!-- Shield 1: TRAJECTORY (left) -->
  <g transform="translate(220,120)">
    <path class="shield" d="M 0 18 Q 0 0 18 0 L 92 0 Q 110 0 110 18 L 110 94 Q 110 134 55 174 Q 0 134 0 94 Z"/>
    <circle cx="26" cy="58" r="6" class="motif-dot"/>
    <path class="motif" d="M 26 58 L 55 82 L 84 58 L 84 108"/>
    <circle cx="84" cy="108" r="6" class="motif-dot"/>
    <text class="shieldlabel" x="55" y="222" text-anchor="middle">TRAJECTORY</text>
  </g>

  <!-- Shield 2: CANCEL (center) -->
  <g transform="translate(425,120)">
    <path class="shield" d="M 0 18 Q 0 0 18 0 L 92 0 Q 110 0 110 18 L 110 60 L 94 70 L 110 80 L 110 94 Q 110 134 55 174 Q 0 134 0 94 Z"/>
    <circle cx="26" cy="64" r="5" class="motif-dot"/>
    <circle cx="44" cy="80" r="5" class="motif-dot"/>
    <circle cx="62" cy="96" r="5" class="motif-dot"/>
    <line x1="72" y1="60" x2="100" y2="112" class="cut"/>
    <text class="shieldlabel" x="55" y="222" text-anchor="middle">CANCEL</text>
  </g>

  <!-- Shield 3: PII LEAK (right) - highlighted -->
  <g transform="translate(630,120)">
    <path class="shield-fill" d="M 0 18 Q 0 0 18 0 L 92 0 Q 110 0 110 18 L 110 94 Q 110 134 55 174 Q 0 134 0 94 Z"/>
    <rect x="22" y="44" width="66" height="26" rx="4" class="motif-accent"/>
    <text x="55" y="62" text-anchor="middle" class="arg">tool.args</text>
    <path class="drop" d="M 55 82 Q 48 98 55 108 Q 62 98 55 82 Z"/>
    <circle cx="55" cy="124" r="4" class="drop"/>
    <circle cx="55" cy="140" r="3" class="drop"/>
    <text class="shieldlabel-accent" x="55" y="222" text-anchor="middle">PII · LEAK</text>
  </g>

  <!-- Scenario tally -->
  <g transform="translate(300,420)">
    <text class="tally-text" x="0" y="0">20 enterprise scenarios</text>
    <g transform="translate(0,20)">
      <line class="tally" x1="0"   y1="0" x2="0"   y2="18"/>
      <line class="tally" x1="18"  y1="0" x2="18"  y2="18"/>
      <line class="tally" x1="36"  y1="0" x2="36"  y2="18"/>
      <line class="tally" x1="54"  y1="0" x2="54"  y2="18"/>
      <line class="tally" x1="72"  y1="0" x2="72"  y2="18"/>
      <line class="tally" x1="90"  y1="0" x2="90"  y2="18"/>
      <line class="tally" x1="108" y1="0" x2="108" y2="18"/>
      <line class="tally" x1="126" y1="0" x2="126" y2="18"/>
      <line class="tally" x1="144" y1="0" x2="144" y2="18"/>
      <line class="tally" x1="162" y1="0" x2="162" y2="18"/>
      <line class="tally" x1="180" y1="0" x2="180" y2="18"/>
      <line class="tally" x1="198" y1="0" x2="198" y2="18"/>
      <line class="tally" x1="216" y1="0" x2="216" y2="18"/>
      <line class="tally" x1="234" y1="0" x2="234" y2="18"/>
      <line class="tally" x1="252" y1="0" x2="252" y2="18"/>
      <line class="tally" x1="270" y1="0" x2="270" y2="18"/>
      <line class="tally" x1="288" y1="0" x2="288" y2="18"/>
      <line class="tally" x1="306" y1="0" x2="306" y2="18"/>
      <line class="tally" x1="324" y1="0" x2="324" y2="18"/>
      <line class="tally" x1="342" y1="0" x2="342" y2="18"/>
    </g>
  </g>
</svg>
