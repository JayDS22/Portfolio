<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none" role="img" aria-label="Enterprise LLM evals schematic: three novel evaluations the public corpus is missing, trajectory, streaming cancel, and PII leak through tool arguments">
  <style>
    .label { font: 500 11px "JetBrains Mono", ui-monospace, monospace; fill: currentColor; letter-spacing: 0.06em; }
    .big   { font: 600 22px "Space Grotesk", "Inter", sans-serif; fill: currentColor; letter-spacing: -0.01em; }
    .kick  { font: 500 10px "JetBrains Mono", ui-monospace, monospace; fill: currentColor; opacity: 0.6; letter-spacing: 0.14em; text-transform: uppercase; }
    .shield { stroke: currentColor; stroke-width: 1.5; fill: none; }
    .shield-fill { stroke: #1d4ed8; stroke-width: 1.6; fill: #1d4ed8; fill-opacity: 0.08; }
    .shieldlabel { font: 600 11px "JetBrains Mono", ui-monospace, monospace; fill: currentColor; letter-spacing: 0.08em; }
    .motif { stroke: currentColor; stroke-width: 1.3; fill: none; opacity: 0.8; }
    .motif-accent { stroke: #1d4ed8; stroke-width: 1.6; fill: none; }
    .tally { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.5; }
    .tally-text { font: 500 9px "JetBrains Mono", ui-monospace, monospace; fill: currentColor; opacity: 0.6; letter-spacing: 0.04em; }
    .drop { fill: #1d4ed8; }
  </style>

  <!-- Title block -->
  <text class="kick" x="40" y="56">LLM EVALUATION · OCT 2026</text>
  <text class="big"  x="40" y="92">Enterprise Evals · 3 Novel</text>
  <text class="label" x="40" y="118" opacity="0.75">trajectory · cancel-validity · PII via tools</text>

  <!-- Three shields in a row -->
  <!-- Shield shape: rounded top, pointed bottom; approx 70w x 90h -->

  <!-- Shield 1: TRAJECTORY (left) -->
  <g transform="translate(390,80)">
    <path class="shield" d="M 0 10 Q 0 0 10 0 L 50 0 Q 60 0 60 10 L 60 50 Q 60 70 30 90 Q 0 70 0 50 Z"/>
    <!-- motif: path/trajectory arrow -->
    <circle cx="14" cy="30" r="3" fill="currentColor" opacity="0.8"/>
    <path class="motif" d="M 14 30 L 30 42 L 46 30 L 46 54"/>
    <circle cx="46" cy="54" r="3" fill="currentColor" opacity="0.8"/>
    <text class="shieldlabel" x="30" y="108" text-anchor="middle">TRAJECTORY</text>
  </g>

  <!-- Shield 2: CANCEL (center) with notch cut -->
  <g transform="translate(500,80)">
    <!-- Shield with notch on right edge -->
    <path class="shield" d="M 0 10 Q 0 0 10 0 L 50 0 Q 60 0 60 10 L 60 30 L 52 36 L 60 42 L 60 50 Q 60 70 30 90 Q 0 70 0 50 Z"/>
    <!-- motif: stream dots cut off -->
    <circle cx="14" cy="32" r="2.4" fill="currentColor" opacity="0.75"/>
    <circle cx="24" cy="40" r="2.4" fill="currentColor" opacity="0.75"/>
    <circle cx="34" cy="48" r="2.4" fill="currentColor" opacity="0.75"/>
    <!-- cut line -->
    <line x1="40" y1="30" x2="54" y2="58" stroke="#b88746" stroke-width="1.6" stroke-dasharray="3 3"/>
    <text class="shieldlabel" x="30" y="108" text-anchor="middle">CANCEL</text>
  </g>

  <!-- Shield 3: PII LEAK (right) - highlighted with accent fill tint -->
  <g transform="translate(610,80)">
    <path class="shield-fill" d="M 0 10 Q 0 0 10 0 L 50 0 Q 60 0 60 10 L 60 50 Q 60 70 30 90 Q 0 70 0 50 Z"/>
    <!-- motif: tool-call box with drop -->
    <rect x="12" y="22" width="36" height="14" rx="2" class="motif-accent"/>
    <text x="30" y="33" text-anchor="middle" fill="#1d4ed8" style="font: 600 7px 'JetBrains Mono', monospace;">tool.arg</text>
    <!-- leak drop -->
    <path class="drop" d="M 30 42 Q 26 50 30 54 Q 34 50 30 42 Z"/>
    <circle cx="30" cy="62" r="2" class="drop"/>
    <text class="shieldlabel" x="30" y="108" text-anchor="middle" fill="#1d4ed8">PII · LEAK</text>
  </g>

  <!-- Scenario tally row (20 marks across the bottom) -->
  <g transform="translate(390,210)">
    <text class="tally-text" x="0" y="24">20 enterprise scenarios</text>
    <g transform="translate(0,32)">
      <!-- 20 tiny marks -->
      <g>
        <line class="tally" x1="0"   y1="0" x2="0"   y2="8"/>
        <line class="tally" x1="14"  y1="0" x2="14"  y2="8"/>
        <line class="tally" x1="28"  y1="0" x2="28"  y2="8"/>
        <line class="tally" x1="42"  y1="0" x2="42"  y2="8"/>
        <line class="tally" x1="56"  y1="0" x2="56"  y2="8"/>
        <line class="tally" x1="70"  y1="0" x2="70"  y2="8"/>
        <line class="tally" x1="84"  y1="0" x2="84"  y2="8"/>
        <line class="tally" x1="98"  y1="0" x2="98"  y2="8"/>
        <line class="tally" x1="112" y1="0" x2="112" y2="8"/>
        <line class="tally" x1="126" y1="0" x2="126" y2="8"/>
        <line class="tally" x1="140" y1="0" x2="140" y2="8"/>
        <line class="tally" x1="154" y1="0" x2="154" y2="8"/>
        <line class="tally" x1="168" y1="0" x2="168" y2="8"/>
        <line class="tally" x1="182" y1="0" x2="182" y2="8"/>
        <line class="tally" x1="196" y1="0" x2="196" y2="8"/>
        <line class="tally" x1="210" y1="0" x2="210" y2="8"/>
        <line class="tally" x1="224" y1="0" x2="224" y2="8"/>
        <line class="tally" x1="238" y1="0" x2="238" y2="8"/>
        <line class="tally" x1="252" y1="0" x2="252" y2="8"/>
        <line class="tally" x1="266" y1="0" x2="266" y2="8"/>
      </g>
    </g>
  </g>
</svg>
