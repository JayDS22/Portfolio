<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <style>
    .rail       { stroke: currentColor; stroke-width: 2; fill: none; opacity: 0.35; }
    .taskaxis   { stroke: currentColor; stroke-width: 1.4; opacity: 0.18; fill: none; }
    .pass-fill  { fill: #1d4ed8; }
    .fail-stroke{ stroke: currentColor; stroke-width: 1.8; fill: none; opacity: 0.5; }
    .rail-label { fill: currentColor; font: 700 20px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.1em; }
    .task-label { fill: currentColor; opacity: 0.6; font: 500 16px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.06em; }
    .legend     { fill: currentColor; opacity: 0.75; font: 500 16px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.06em; }
    .foot       { fill: currentColor; opacity: 0.4; font: 500 14px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.05em; }
  </style>

  <!-- Three agent rails -->
  <line class="rail" x1="330" y1="120" x2="330" y2="420"/>
  <text class="rail-label" x="330" y="100" text-anchor="middle">REPLIT</text>

  <line class="rail" x1="500" y1="120" x2="500" y2="420"/>
  <text class="rail-label" x="500" y="100" text-anchor="middle">CURSOR</text>

  <line class="rail" x1="670" y1="120" x2="670" y2="420"/>
  <text class="rail-label" x="670" y="100" text-anchor="middle">CLAUDE</text>

  <!-- Task axis labels and horizontal guides (7 rows, y = 140, 180, 220, 260, 300, 340, 380) -->
  <g>
    <line class="taskaxis" x1="260" y1="140" x2="740" y2="140"/>
    <text class="task-label" x="252" y="146" text-anchor="end">t1</text>
    <line class="taskaxis" x1="260" y1="180" x2="740" y2="180"/>
    <text class="task-label" x="252" y="186" text-anchor="end">t2</text>
    <line class="taskaxis" x1="260" y1="220" x2="740" y2="220"/>
    <text class="task-label" x="252" y="226" text-anchor="end">t3</text>
    <line class="taskaxis" x1="260" y1="260" x2="740" y2="260"/>
    <text class="task-label" x="252" y="266" text-anchor="end">t4</text>
    <line class="taskaxis" x1="260" y1="300" x2="740" y2="300"/>
    <text class="task-label" x="252" y="306" text-anchor="end">t5</text>
    <line class="taskaxis" x1="260" y1="340" x2="740" y2="340"/>
    <text class="task-label" x="252" y="346" text-anchor="end">t6</text>
    <line class="taskaxis" x1="260" y1="380" x2="740" y2="380"/>
    <text class="task-label" x="252" y="386" text-anchor="end">t7</text>
  </g>

  <!-- Marks: pattern is illustrative only, not real data -->
  <!-- REPLIT -->
  <circle cx="330" cy="140" r="9" class="pass-fill"/>
  <circle cx="330" cy="180" r="9" class="fail-stroke"/>
  <circle cx="330" cy="220" r="9" class="pass-fill"/>
  <circle cx="330" cy="260" r="9" class="pass-fill"/>
  <circle cx="330" cy="300" r="9" class="fail-stroke"/>
  <circle cx="330" cy="340" r="9" class="pass-fill"/>
  <circle cx="330" cy="380" r="9" class="fail-stroke"/>

  <!-- CURSOR -->
  <circle cx="500" cy="140" r="9" class="pass-fill"/>
  <circle cx="500" cy="180" r="9" class="pass-fill"/>
  <circle cx="500" cy="220" r="9" class="pass-fill"/>
  <circle cx="500" cy="260" r="9" class="fail-stroke"/>
  <circle cx="500" cy="300" r="9" class="pass-fill"/>
  <circle cx="500" cy="340" r="9" class="pass-fill"/>
  <circle cx="500" cy="380" r="9" class="fail-stroke"/>

  <!-- CLAUDE -->
  <circle cx="670" cy="140" r="9" class="pass-fill"/>
  <circle cx="670" cy="180" r="9" class="pass-fill"/>
  <circle cx="670" cy="220" r="9" class="fail-stroke"/>
  <circle cx="670" cy="260" r="9" class="pass-fill"/>
  <circle cx="670" cy="300" r="9" class="pass-fill"/>
  <circle cx="670" cy="340" r="9" class="pass-fill"/>
  <circle cx="670" cy="380" r="9" class="pass-fill"/>

  <!-- Legend -->
  <circle cx="270" cy="455" r="9" class="pass-fill"/>
  <text class="legend" x="290" y="462">pass</text>
  <circle cx="370" cy="455" r="9" class="fail-stroke"/>
  <text class="legend" x="390" y="462">fail</text>

  <text class="foot" x="740" y="462" text-anchor="end">illustrative, see repo for live run</text>
</svg>
