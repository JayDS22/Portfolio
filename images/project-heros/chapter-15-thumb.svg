<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <defs>
    <linearGradient id="panel-ch15-thumb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2236"/>
      <stop offset="100%" stop-color="#0c1424"/>
    </linearGradient>
  </defs>
  <style>
    .wire        { stroke: #b88746; stroke-width: 1.6; stroke-dasharray: 5 6; fill: none; opacity: 0.75; }
    .wire-corner { stroke: #b88746; stroke-width: 1.6; stroke-dasharray: 5 6; fill: none; opacity: 0.6; }
    .wire-dot    { fill: #b88746; }
    .node-ring   { stroke: #b88746; stroke-width: 2; fill: #0c1424; }
    .node-ring-accent { stroke: #1d4ed8; stroke-width: 2.4; fill: #0c1424; }
    .node-text   { fill: #f7f8fb; font: 700 11px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.08em; text-anchor: middle; }
    .node-text-accent { fill: #1d4ed8; font: 700 11px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.08em; text-anchor: middle; }
    .bubble-stroke { stroke: #1d4ed8; stroke-width: 2.4; fill: #0c1424; }
    .bubble-text { fill: #1d4ed8; font: 800 32px "Space Grotesk", "Inter", sans-serif; letter-spacing: 0.04em; text-anchor: middle; }
    .bubble-sub  { fill: #8899aa; font: 500 11px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.1em; text-anchor: middle; }
    .frame       { stroke: #b88746; stroke-width: 1.5; stroke-dasharray: 4 5; fill: none; opacity: 0.5; }
    .motif       { stroke: #f7f8fb; stroke-width: 1.4; fill: none; opacity: 0.85; }
    .motif-dot   { fill: #f7f8fb; }
    .motif-accent-dot { fill: #1d4ed8; }
    .motif-cut   { stroke: #b88746; stroke-width: 1.8; stroke-dasharray: 2 2; }
    .drop        { fill: #1d4ed8; }
  </style>

  <!-- Panel background -->
  <rect width="960" height="540" fill="url(#panel-ch15-thumb)"/>

  <!-- Outer dashed frame (nod to the LLM-serving aesthetic) -->
  <rect x="38" y="38" width="884" height="464" rx="4" class="frame"/>
  <!-- Frame corner markers -->
  <circle cx="38"  cy="38"  r="4" class="wire-dot"/>
  <circle cx="922" cy="38"  r="4" class="wire-dot"/>
  <circle cx="38"  cy="502" r="4" class="wire-dot"/>
  <circle cx="922" cy="502" r="4" class="wire-dot"/>

  <!-- Central EVALS bubble (speech-bubble shape with notch) -->
  <path class="bubble-stroke" d="M 400 212 Q 400 182 430 182 L 530 182 Q 560 182 560 212 L 560 288 Q 560 318 530 318 L 500 318 L 486 338 L 480 318 L 430 318 Q 400 318 400 288 Z"/>
  <text x="480" y="260" class="bubble-text">EVALS</text>
  <text x="480" y="294" class="bubble-sub">openai/evals format</text>

  <!-- Three outer eval nodes (120deg apart around the bubble) -->

  <!-- TRAJECTORY node (top-left) -->
  <circle cx="200" cy="140" r="52" class="node-ring"/>
  <!-- motif: path with waypoints -->
  <circle cx="178" cy="126" r="4" class="motif-dot"/>
  <path class="motif" d="M 178 126 L 200 148 L 222 128 L 222 158"/>
  <circle cx="222" cy="158" r="4" class="motif-dot"/>
  <text x="200" y="214" class="node-text">TRAJECTORY</text>

  <!-- CANCEL node (top-right) -->
  <circle cx="760" cy="140" r="52" class="node-ring"/>
  <!-- motif: stream of dots with a cut mark -->
  <circle cx="738" cy="126" r="3.5" class="motif-dot"/>
  <circle cx="754" cy="138" r="3.5" class="motif-dot"/>
  <circle cx="770" cy="150" r="3.5" class="motif-dot"/>
  <line x1="748" y1="118" x2="786" y2="162" class="motif-cut"/>
  <text x="760" y="214" class="node-text">CANCEL</text>

  <!-- PII LEAK node (bottom, highlighted accent) -->
  <circle cx="480" cy="400" r="48" class="node-ring-accent"/>
  <!-- motif: tool.args box with drop -->
  <rect x="454" y="378" width="52" height="18" rx="3" class="motif" stroke="#1d4ed8"/>
  <text x="480" y="391" text-anchor="middle" style="fill:#1d4ed8;font:700 10px 'JetBrains Mono',monospace;letter-spacing:0.05em;">tool.args</text>
  <path class="drop" d="M 480 406 Q 475 416 480 422 Q 485 416 480 406 Z"/>
  <circle cx="480" cy="428" r="2.4" class="motif-accent-dot"/>
  <text x="480" y="470" class="node-text-accent">PII · LEAK</text>

  <!-- Dashed connections from bubble to each node -->
  <!-- To TRAJECTORY -->
  <path class="wire" d="M 410 195 L 240 160"/>
  <circle cx="410" cy="195" r="3" class="wire-dot"/>
  <circle cx="240" cy="160" r="3" class="wire-dot"/>

  <!-- To CANCEL -->
  <path class="wire" d="M 550 195 L 720 160"/>
  <circle cx="550" cy="195" r="3" class="wire-dot"/>
  <circle cx="720" cy="160" r="3" class="wire-dot"/>

  <!-- To PII LEAK -->
  <path class="wire" d="M 480 330 L 480 352"/>
  <circle cx="480" cy="330" r="3" class="wire-dot"/>
  <circle cx="480" cy="352" r="3" class="motif-accent-dot"/>

  <!-- Perimeter satellite nodes (enterprise scenarios, small, decorative, suggest the 20-scenario surface) -->
  <!-- Left side -->
  <circle cx="90"  cy="310" r="18" class="node-ring"/>
  <text x="90"  y="314" class="node-text" style="font-size:9px;">SQL</text>
  <path class="wire-corner" d="M 108 310 L 148 310"/>

  <!-- Right side -->
  <circle cx="870" cy="310" r="18" class="node-ring"/>
  <text x="870" y="314" class="node-text" style="font-size:9px;">RAG</text>
  <path class="wire-corner" d="M 852 310 L 812 310"/>

  <!-- Bottom-left -->
  <circle cx="150" cy="450" r="18" class="node-ring"/>
  <text x="150" y="454" class="node-text" style="font-size:9px;">DOC</text>
  <path class="wire-corner" d="M 165 440 L 220 410"/>

  <!-- Bottom-right -->
  <circle cx="810" cy="450" r="18" class="node-ring"/>
  <text x="810" y="454" class="node-text" style="font-size:9px;">STR</text>
  <path class="wire-corner" d="M 795 440 L 740 410"/>
</svg>
