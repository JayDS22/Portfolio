<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <defs>
    <marker id="arrow-ch11-thumb" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#1d4ed8" opacity="0.9"/>
    </marker>
    <linearGradient id="panel-ch11-thumb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2236"/>
      <stop offset="100%" stop-color="#0c1424"/>
    </linearGradient>
  </defs>
  <style>
    .kicker { fill: #8899aa; font: 600 20px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.18em; text-transform: uppercase; }
    .headline-accent { fill: #1d4ed8; font: 700 68px "Space Grotesk", "Inter", sans-serif; letter-spacing: -0.02em; }
    .headline { fill: #f7f8fb; font: 700 48px "Space Grotesk", "Inter", sans-serif; letter-spacing: -0.01em; }
    .node-label { fill: #f7f8fb; font: 700 20px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.08em; }
    .node-sub   { fill: #8899aa; font: 500 13px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.04em; }
    .edge-label { fill: #8899aa; font: 500 12px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.08em; }
    .metric { fill: #f7f8fb; font: 600 18px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.06em; }
    .metric-sep { stroke: #475467; stroke-width: 1.4; opacity: 0.6; }
    .badge-text { fill: #0c1424; font: 700 15px "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.1em; }
    .col-stroke { stroke: #f7f8fb; stroke-width: 2; fill: none; }
    .col-fill   { fill: #f7f8fb; opacity: 0.85; }
    .vec-dot    { fill: #1d4ed8; opacity: 0.95; }
    .vec-ring   { stroke: #1d4ed8; stroke-width: 1.6; fill: none; stroke-dasharray: 5 6; opacity: 0.6; }
  </style>

  <!-- Panel background -->
  <rect width="960" height="540" fill="url(#panel-ch11-thumb)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.08">
    <circle cx="60"  cy="80"  r="1.2" fill="#f7f8fb"/>
    <circle cx="900" cy="80"  r="1.2" fill="#f7f8fb"/>
    <circle cx="60"  cy="480" r="1.2" fill="#f7f8fb"/>
    <circle cx="900" cy="480" r="1.2" fill="#f7f8fb"/>
  </g>

  <!-- Kicker -->
  <text class="kicker" x="60" y="78">AWS Redshift ML · Summer 2026</text>

  <!-- Headline, two lines, non-overlapping -->
  <text class="headline-accent" x="60" y="156">Vector search</text>
  <text class="headline" x="60" y="208">at warehouse scale.</text>

  <!-- Three-service architecture row -->
  <!-- Redshift (columnar stacks) -->
  <g transform="translate(60,290)">
    <rect x="0"  y="0"  width="18" height="80" class="col-stroke"/>
    <rect x="0"  y="18" width="18" height="20" class="col-fill"/>
    <rect x="0"  y="48" width="18" height="12" class="col-fill"/>
    <rect x="26" y="0"  width="18" height="80" class="col-stroke"/>
    <rect x="26" y="10" width="18" height="32" class="col-fill"/>
    <rect x="26" y="54" width="18" height="18" class="col-fill"/>
    <rect x="52" y="0"  width="18" height="80" class="col-stroke"/>
    <rect x="52" y="6"  width="18" height="14" class="col-fill"/>
    <rect x="52" y="34" width="18" height="30" class="col-fill"/>
    <text class="node-label" x="35" y="110" text-anchor="middle">REDSHIFT</text>
    <text class="node-sub"   x="35" y="128" text-anchor="middle">columnar store</text>
  </g>

  <!-- Edge Redshift -> Vectors -->
  <path d="M 185 330 L 335 330" stroke="#1d4ed8" stroke-width="2.2" fill="none" opacity="0.9" marker-end="url(#arrow-ch11-thumb)"/>
  <text class="edge-label" x="260" y="320" text-anchor="middle">similarity</text>

  <!-- Vectors (scatter cluster) -->
  <g transform="translate(380,296)">
    <ellipse cx="80" cy="36" rx="86" ry="42" class="vec-ring"/>
    <circle cx="30"  cy="24" r="4" class="vec-dot"/>
    <circle cx="54"  cy="12" r="4" class="vec-dot"/>
    <circle cx="80"  cy="20" r="4" class="vec-dot"/>
    <circle cx="108" cy="14" r="4" class="vec-dot"/>
    <circle cx="130" cy="30" r="4" class="vec-dot"/>
    <circle cx="20"  cy="48" r="4" class="vec-dot"/>
    <circle cx="48"  cy="42" r="4" class="vec-dot"/>
    <circle cx="76"  cy="48" r="4" class="vec-dot"/>
    <circle cx="104" cy="42" r="4" class="vec-dot"/>
    <circle cx="138" cy="50" r="4" class="vec-dot"/>
    <circle cx="40"  cy="62" r="4" class="vec-dot"/>
    <circle cx="76"  cy="68" r="4" class="vec-dot"/>
    <circle cx="112" cy="60" r="4" class="vec-dot"/>
    <text class="node-label" x="80" y="104" text-anchor="middle">VECTORS</text>
    <text class="node-sub"   x="80" y="122" text-anchor="middle">500K to 50M indexed</text>
  </g>

  <!-- Edge Vectors -> Bedrock -->
  <path d="M 550 330 L 700 330" stroke="#1d4ed8" stroke-width="2.2" fill="none" opacity="0.9" marker-end="url(#arrow-ch11-thumb)"/>
  <text class="edge-label" x="625" y="320" text-anchor="middle">embed / rerank</text>

  <!-- Bedrock (filled accent node) -->
  <g transform="translate(760,296)">
    <circle cx="40" cy="40" r="40" fill="#1d4ed8"/>
    <text x="40" y="46" text-anchor="middle" style="fill:#f7f8fb;font:700 18px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:0.08em;">FM</text>
    <text class="node-label" x="40" y="110" text-anchor="middle">BEDROCK</text>
    <text class="node-sub"   x="40" y="128" text-anchor="middle">foundation model</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="458" x2="620" y2="458" class="metric-sep"/>

  <!-- Metrics strip -->
  <text class="metric" x="60" y="490">p95 &lt; 100ms</text>
  <text class="metric" x="230" y="490" fill="#8899aa">·</text>
  <text class="metric" x="252" y="490">3.2x cost cut</text>
  <text class="metric" x="420" y="490" fill="#8899aa">·</text>
  <text class="metric" x="442" y="490">native in SQL</text>

  <!-- AUTA Winner badge -->
  <rect x="700" y="470" width="200" height="36" rx="18" fill="#b88746"/>
  <text class="badge-text" x="800" y="494" text-anchor="middle">AUTA WINNER · 800+</text>
</svg>
