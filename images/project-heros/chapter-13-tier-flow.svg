<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'JetBrains Mono', monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="#ecf0f6"/>

  <!-- PROPOSED ACTION node -->
  <circle cx="90" cy="225" r="46" fill="#1d4ed8" stroke="#0c1424" stroke-width="1.5"/>
  <text x="90" y="221" text-anchor="middle" font-size="10" fill="#f7f8fb">PROPOSED</text>
  <text x="90" y="235" text-anchor="middle" font-size="10" fill="#f7f8fb">ACTION</text>

  <!-- Arrow to classifier -->
  <line x1="138" y1="225" x2="258" y2="225" stroke="#475467" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- PAYLOAD CLASSIFIER diamond -->
  <polygon points="360,155 460,225 360,295 260,225" fill="#f7f8fb" stroke="#0c1424" stroke-width="1.8"/>
  <text x="360" y="221" text-anchor="middle" font-size="11" fill="#0c1424">PAYLOAD</text>
  <text x="360" y="235" text-anchor="middle" font-size="11" fill="#0c1424">CLASSIFIER</text>

  <!-- Top branch to PASS -->
  <line x1="430" y1="175" x2="590" y2="90" stroke="#475467" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="490" y="118" font-size="9" fill="#475467">benign-navigation,</text>
  <text x="490" y="131" font-size="9" fill="#475467">non-sensitive input</text>

  <!-- Middle branch to CONFIRM -->
  <line x1="460" y1="225" x2="590" y2="225" stroke="#475467" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="214" font-size="9" fill="#475467">credential-exposure,</text>
  <text x="470" y="246" font-size="9" fill="#475467">external-dispatch (known)</text>

  <!-- Bottom branch to BLOCK -->
  <line x1="430" y1="275" x2="590" y2="360" stroke="#475467" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="318" font-size="9" fill="#475467">external-dispatch (unknown),</text>
  <text x="470" y="331" font-size="9" fill="#475467">destructive without context</text>

  <!-- PASS node -->
  <rect x="610" y="60" width="140" height="60" rx="8" fill="#a3d9a5" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="680" y="95" text-anchor="middle" font-size="14" fill="#0c1424" font-weight="700">PASS</text>
  <text x="680" y="140" text-anchor="middle" font-size="9" fill="#475467">dispatch -&gt; browser</text>

  <!-- CONFIRM node -->
  <rect x="610" y="195" width="140" height="60" rx="8" fill="#b88746" stroke="#0c1424" stroke-width="1.8"/>
  <text x="680" y="230" text-anchor="middle" font-size="14" fill="#f7f8fb" font-weight="700">CONFIRM</text>
  <text x="680" y="275" text-anchor="middle" font-size="9" fill="#475467">user prompt required</text>

  <!-- BLOCK node -->
  <rect x="610" y="330" width="140" height="60" rx="8" fill="#475467" stroke="#0c1424" stroke-width="1.8"/>
  <text x="680" y="365" text-anchor="middle" font-size="14" fill="#f7f8fb" font-weight="700">BLOCK</text>
  <text x="680" y="410" text-anchor="middle" font-size="9" fill="#475467">action discarded, logged</text>
</svg>
