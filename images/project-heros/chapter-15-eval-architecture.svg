<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="JetBrains Mono, ui-monospace, monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#1a2236"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1d4ed8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="450" fill="url(#bgGrad)"/>
  <rect width="900" height="450" fill="url(#grid)"/>

  <!-- SCENARIO RUNNER bar -->
  <g>
    <rect x="60" y="34" width="780" height="46" rx="6" fill="#1a2236" stroke="#475467" stroke-width="1"/>
    <rect x="60" y="34" width="4" height="46" rx="2" fill="#1d4ed8"/>
    <text x="80" y="63" fill="#ecf0f6" font-size="13" letter-spacing="2">SCENARIO RUNNER</text>
    <text x="268" y="63" fill="#8899aa" font-size="11">20 enterprise + 3 novel  ::  openai/evals schema</text>
    <!-- status pips -->
    <circle cx="760" cy="57" r="3" fill="#1d4ed8"/>
    <circle cx="772" cy="57" r="3" fill="#b88746"/>
    <circle cx="784" cy="57" r="3" fill="#475467"/>
    <text x="796" y="61" fill="#8899aa" font-size="10">run.yaml</text>
  </g>

  <!-- Feeder lines from runner to columns -->
  <g stroke="#475467" stroke-width="1" fill="none" stroke-dasharray="2,3">
    <path d="M 185 80 L 185 108"/>
    <path d="M 450 80 L 450 108"/>
    <path d="M 715 80 L 715 108"/>
  </g>

  <!-- ============ COLUMN 1: TRAJECTORY ============ -->
  <g>
    <rect x="80" y="110" width="210" height="240" rx="8" fill="#0c1424" stroke="#475467" stroke-width="1"/>
    <text x="98" y="134" fill="#ecf0f6" font-size="12" letter-spacing="2">TRAJECTORY</text>
    <text x="98" y="150" fill="#8899aa" font-size="10">tool-use path diff</text>

    <!-- INPUT label -->
    <text x="98" y="178" fill="#475467" font-size="9" letter-spacing="1.5">INPUT</text>
    <rect x="98" y="186" width="174" height="54" rx="4" fill="#1a2236" stroke="#475467" stroke-width="1"/>
    <text x="110" y="204" fill="#ecf0f6" font-size="10">target trajectory</text>
    <text x="110" y="217" fill="#ecf0f6" font-size="10">graph</text>

    <!-- graph icon: 4 nodes with edges -->
    <g transform="translate(222,195)">
      <line x1="4" y1="6" x2="20" y2="6" stroke="#8899aa" stroke-width="1"/>
      <line x1="20" y1="6" x2="20" y2="22" stroke="#8899aa" stroke-width="1"/>
      <line x1="20" y1="22" x2="36" y2="22" stroke="#8899aa" stroke-width="1"/>
      <line x1="20" y1="6" x2="36" y2="22" stroke="#8899aa" stroke-width="1" stroke-dasharray="1,2"/>
      <circle cx="4" cy="6" r="3" fill="#1d4ed8"/>
      <circle cx="20" cy="6" r="3" fill="#8899aa"/>
      <circle cx="20" cy="22" r="3" fill="#8899aa"/>
      <circle cx="36" cy="22" r="3" fill="#1d4ed8"/>
    </g>

    <!-- arrow -->
    <g stroke="#475467" stroke-width="1" fill="none">
      <path d="M 185 244 L 185 264"/>
      <path d="M 181 260 L 185 266 L 189 260" fill="#475467" stroke="none"/>
    </g>

    <!-- OUTPUT label -->
    <text x="98" y="280" fill="#475467" font-size="9" letter-spacing="1.5">OUTPUT</text>
    <rect x="98" y="288" width="174" height="54" rx="4" fill="#1a2236" stroke="#475467" stroke-width="1"/>
    <text x="110" y="306" fill="#ecf0f6" font-size="10">diff vs observed</text>
    <text x="110" y="319" fill="#8899aa" font-size="9">edit-distance + order</text>

    <!-- diff icon: + / - lines -->
    <g transform="translate(226,296)">
      <rect x="0" y="0" width="36" height="4" fill="#a3d9a5" fill-opacity="0.35"/>
      <text x="2" y="3.6" fill="#a3d9a5" font-size="5">+</text>
      <rect x="0" y="6" width="36" height="4" fill="#b88746" fill-opacity="0.25"/>
      <text x="2" y="9.6" fill="#b88746" font-size="5">-</text>
      <rect x="0" y="12" width="36" height="4" fill="#475467" fill-opacity="0.35"/>
      <rect x="0" y="18" width="36" height="4" fill="#a3d9a5" fill-opacity="0.35"/>
      <text x="2" y="21.6" fill="#a3d9a5" font-size="5">+</text>
      <rect x="0" y="24" width="36" height="4" fill="#475467" fill-opacity="0.35"/>
    </g>
  </g>

  <!-- ============ COLUMN 2: CANCEL VALIDITY ============ -->
  <g>
    <rect x="345" y="110" width="210" height="240" rx="8" fill="#0c1424" stroke="#475467" stroke-width="1"/>
    <text x="363" y="134" fill="#ecf0f6" font-size="12" letter-spacing="2">CANCEL VALIDITY</text>
    <text x="363" y="150" fill="#8899aa" font-size="10">streaming abort safety</text>

    <text x="363" y="178" fill="#475467" font-size="9" letter-spacing="1.5">INPUT</text>
    <rect x="363" y="186" width="174" height="54" rx="4" fill="#1a2236" stroke="#475467" stroke-width="1"/>
    <text x="375" y="204" fill="#ecf0f6" font-size="10">scripted cancel</text>
    <text x="375" y="217" fill="#ecf0f6" font-size="10">point</text>

    <!-- notch / cut icon: stream line with a slice -->
    <g transform="translate(485,196)">
      <line x1="0" y1="12" x2="18" y2="12" stroke="#8899aa" stroke-width="2"/>
      <line x1="22" y1="4" x2="30" y2="20" stroke="#b88746" stroke-width="1.5"/>
      <line x1="34" y1="12" x2="48" y2="12" stroke="#475467" stroke-width="2" stroke-dasharray="2,2"/>
      <circle cx="0" cy="12" r="2" fill="#1d4ed8"/>
    </g>

    <g stroke="#475467" stroke-width="1" fill="none">
      <path d="M 450 244 L 450 264"/>
      <path d="M 446 260 L 450 266 L 454 260" fill="#475467" stroke="none"/>
    </g>

    <text x="363" y="280" fill="#475467" font-size="9" letter-spacing="1.5">OUTPUT</text>
    <rect x="363" y="288" width="174" height="54" rx="4" fill="#1a2236" stroke="#475467" stroke-width="1"/>
    <text x="375" y="306" fill="#ecf0f6" font-size="10">partial JSON parses?</text>
    <text x="375" y="319" fill="#8899aa" font-size="9">json.loads(prefix)</text>

    <!-- brace icon -->
    <g transform="translate(495,295)" fill="none" stroke="#8899aa" stroke-width="1.2">
      <path d="M 10 2 Q 2 2 2 10 Q 2 18 10 18"/>
      <path d="M 20 2 Q 28 2 28 10 Q 28 18 20 18"/>
    </g>
  </g>

  <!-- ============ COLUMN 3: PII LEAK (highlighted) ============ -->
  <g>
    <rect x="610" y="110" width="210" height="240" rx="8" fill="#0c1424" stroke="#b88746" stroke-width="1.5"/>
    <rect x="610" y="110" width="210" height="4" rx="2" fill="#b88746"/>
    <text x="628" y="134" fill="#b88746" font-size="12" letter-spacing="2">PII LEAK</text>
    <text x="628" y="150" fill="#8899aa" font-size="10">tagged value egress</text>

    <text x="628" y="178" fill="#475467" font-size="9" letter-spacing="1.5">INPUT</text>
    <rect x="628" y="186" width="174" height="54" rx="4" fill="#1a2236" stroke="#b88746" stroke-width="1" stroke-opacity="0.6"/>
    <text x="640" y="204" fill="#ecf0f6" font-size="10">tagged sensitive</text>
    <text x="640" y="217" fill="#ecf0f6" font-size="10">values</text>

    <!-- tag icon -->
    <g transform="translate(758,196)" fill="none" stroke="#b88746" stroke-width="1.2">
      <path d="M 2 4 L 14 4 L 24 14 L 14 24 L 2 24 Z"/>
      <circle cx="7" cy="10" r="1.5" fill="#b88746" stroke="none"/>
    </g>

    <g stroke="#b88746" stroke-width="1" fill="none">
      <path d="M 715 244 L 715 264"/>
      <path d="M 711 260 L 715 266 L 719 260" fill="#b88746" stroke="none"/>
    </g>

    <text x="628" y="280" fill="#475467" font-size="9" letter-spacing="1.5">OUTPUT</text>
    <rect x="628" y="288" width="174" height="54" rx="4" fill="#1a2236" stroke="#b88746" stroke-width="1" stroke-opacity="0.6"/>
    <text x="640" y="306" fill="#ecf0f6" font-size="10">match hit in</text>
    <text x="640" y="319" fill="#ecf0f6" font-size="10">tool.args?</text>

    <!-- drop / leak icon -->
    <g transform="translate(770,290)">
      <path d="M 10 4 Q 4 14 10 22 Q 16 14 10 4 Z" fill="#b88746" fill-opacity="0.35" stroke="#b88746" stroke-width="1"/>
      <circle cx="10" cy="30" r="1.5" fill="#b88746"/>
      <circle cx="7" cy="33" r="1" fill="#b88746" fill-opacity="0.6"/>
      <circle cx="13" cy="33" r="1" fill="#b88746" fill-opacity="0.6"/>
    </g>
  </g>

  <!-- Lines from each column to aggregator -->
  <g stroke="#475467" stroke-width="1" fill="none" stroke-dasharray="2,3">
    <path d="M 185 350 L 185 376"/>
    <path d="M 450 350 L 450 376"/>
    <path d="M 715 350 L 715 376"/>
  </g>

  <!-- AGGREGATE SCORER bar -->
  <g>
    <rect x="60" y="378" width="780" height="46" rx="6" fill="#1a2236" stroke="#475467" stroke-width="1"/>
    <rect x="60" y="378" width="4" height="46" rx="2" fill="#b88746"/>
    <text x="80" y="407" fill="#ecf0f6" font-size="13" letter-spacing="2">AGGREGATE SCORER</text>
    <text x="288" y="407" fill="#8899aa" font-size="11">weighted  ::  per-scenario pass/fail</text>

    <!-- JSON output pill -->
    <rect x="716" y="391" width="104" height="20" rx="10" fill="#0c1424" stroke="#1d4ed8" stroke-width="1"/>
    <text x="728" y="405" fill="#ecf0f6" font-size="10">results.json</text>
  </g>
</svg>
