<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="JetBrains Mono, SF Mono, DejaVu Sans Mono, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <symbol id="shield" viewBox="0 0 20 24">
      <path d="M10 1 L18 4 V12 C18 17 14 21 10 23 C6 21 2 17 2 12 V4 Z"
            fill="#b88746" stroke="#0c1424" stroke-width="1"/>
      <path d="M6 11 L9 14 L14 8" fill="none" stroke="#f7f8fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- Plane labels + framing panels -->
  <rect x="20" y="20" width="760" height="200" rx="10" fill="none" stroke="#475467" stroke-width="0.6" stroke-dasharray="2,3"/>
  <rect x="20" y="250" width="760" height="130" rx="10" fill="none" stroke="#475467" stroke-width="0.6" stroke-dasharray="2,3"/>
  <text x="200" y="36" fill="#475467" font-size="11" letter-spacing="2">AGENT PLANE</text>
  <text x="200" y="286" fill="#475467" font-size="11" letter-spacing="2">DATA PLANE</text>
  <text x="770" y="36" fill="#475467" font-size="10" letter-spacing="1" text-anchor="end">OpenAI Agents SDK</text>
  <text x="770" y="286" fill="#475467" font-size="10" letter-spacing="1" text-anchor="end">Postgres 16 + pgvector</text>

  <!-- Agent plane nodes: ORCH + three workers -->
  <!-- ORCH -->
  <rect x="340" y="56" width="120" height="52" rx="8" fill="#ecf0f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="400" y="88" fill="#0c1424" font-size="16" font-weight="700" text-anchor="middle">ORCH</text>

  <!-- Workers row -->
  <rect x="190" y="150" width="110" height="46" rx="8" fill="#ecf0f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="245" y="179" fill="#0c1424" font-size="14" font-weight="700" text-anchor="middle">RET</text>

  <rect x="345" y="150" width="110" height="46" rx="8" fill="#ecf0f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="400" y="179" fill="#0c1424" font-size="14" font-weight="700" text-anchor="middle">SQL</text>

  <rect x="500" y="150" width="110" height="46" rx="8" fill="#ecf0f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="555" y="179" fill="#0c1424" font-size="14" font-weight="700" text-anchor="middle">OUT</text>

  <!-- ORCH -> workers -->
  <line x1="380" y1="108" x2="260" y2="150" stroke="#475467" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="400" y1="108" x2="400" y2="150" stroke="#475467" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="420" y1="108" x2="540" y2="150" stroke="#475467" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- RLS boundary (horizontal dashed line) -->
  <line x1="40" y1="235" x2="760" y2="235" stroke="#b88746" stroke-width="1.5" stroke-dasharray="8,6"/>
  <text x="760" y="229" fill="#b88746" font-size="11" letter-spacing="2" text-anchor="end">RLS BOUNDARY</text>

  <!-- Postgres cylinder -->
  <g transform="translate(340,296)">
    <ellipse cx="60" cy="8" rx="60" ry="10" fill="#ecf0f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <path d="M0,8 L0,64 A60,10 0 0 0 120,64 L120,8" fill="#ecf0f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <ellipse cx="60" cy="8" rx="60" ry="10" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="60" y="46" fill="#0c1424" font-size="13" font-weight="700" text-anchor="middle">POSTGRES</text>
  </g>

  <!-- Worker -> DB arrows crossing the boundary -->
  <line x1="245" y1="196" x2="360" y2="296" stroke="#475467" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="400" y1="196" x2="400" y2="296" stroke="#475467" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="555" y1="196" x2="440" y2="296" stroke="#475467" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Shields on the boundary at each crossing + caption -->
  <use href="#shield" x="275" y="223" width="22" height="26"/>
  <use href="#shield" x="389" y="223" width="22" height="26"/>
  <use href="#shield" x="503" y="223" width="22" height="26"/>

  <text x="400" y="265" fill="#b88746" font-size="10" letter-spacing="1.5" text-anchor="middle">SESSION IDENTITY ENFORCED</text>

  <!-- Left-side bronze annotation callouts -->
  <g font-size="11" fill="#b88746">
    <circle cx="30" cy="76" r="4" fill="#b88746"/>
    <text x="44" y="80">cross-tenant read: prevented</text>

    <circle cx="30" cy="106" r="4" fill="#b88746"/>
    <text x="44" y="110">credential leak via args: prevented (classifier)</text>

    <circle cx="30" cy="136" r="4" fill="#b88746"/>
    <text x="44" y="140">cost exhaustion in own scope: not prevented</text>
  </g>

  <!-- Policy badges on each worker, hinting at the enforced role -->
  <g font-size="9" fill="#475467" letter-spacing="1">
    <text x="245" y="214" text-anchor="middle">role: agent_session</text>
    <text x="400" y="214" text-anchor="middle">role: agent_session</text>
    <text x="555" y="214" text-anchor="middle">role: agent_session</text>
  </g>

  <!-- Query-flow labels on the three DB arrows -->
  <g font-size="9" fill="#8899aa" font-style="italic">
    <text x="298" y="258">docs.read</text>
    <text x="410" y="258">billing.read</text>
    <text x="490" y="258">events.read</text>
  </g>

  <!-- Legend strip (bottom) -->
  <g font-size="10" fill="#475467">
    <rect x="20" y="388" width="12" height="10" fill="#ecf0f6" stroke="#1d4ed8" stroke-width="1"/>
    <text x="38" y="397">agent node</text>

    <line x1="140" y1="393" x2="162" y2="393" stroke="#b88746" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="168" y="397">trust boundary</text>

    <use href="#shield" x="280" y="384" width="12" height="14"/>
    <text x="298" y="397">session identity enforced</text>

    <circle cx="470" cy="393" r="4" fill="#b88746"/>
    <text x="480" y="397">bronze: residual risk callout</text>
  </g>
</svg>
