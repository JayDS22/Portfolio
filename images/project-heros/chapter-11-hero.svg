<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'JetBrains Mono', 'SF Mono', 'DejaVu Sans Mono', monospace">
  <!-- Transparent canvas. Palette:
       INDIGO #1d4ed8 (data flow + FM emphasis)
       BRONZE #b88746 (AUTA winner chip)
       MUTED  #475467 (borders + sublabels)
       TEXT   #0c1424 (service names, chip text)
       WHITE  #f7f8fb (service box fill)
       PALE   #ecf0f6 (chip fill) -->

  <defs>
    <!-- Arrowhead markers (indigo filled triangles) -->
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- ============== TITLE ============== -->
  <text x="960" y="110" text-anchor="middle" font-size="34" font-weight="700" fill="#0c1424" letter-spacing="1">
    AWS REDSHIFT ML  ·  LLM INFRASTRUCTURE
  </text>
  <text x="960" y="150" text-anchor="middle" font-size="20" fill="#475467" letter-spacing="0.5">
    data flow architecture
  </text>

  <!-- ============== SERVICE BOX 1: AMAZON REDSHIFT (left) ============== -->
  <!-- Box geometry: x=120, y=260, w=400, h=360 -->
  <rect x="120" y="260" width="400" height="360" rx="12" ry="12"
        fill="#f7f8fb" stroke="#475467" stroke-width="2"/>
  <!-- Service name header -->
  <text x="320" y="310" text-anchor="middle" font-size="26" font-weight="700" fill="#0c1424">
    Amazon Redshift
  </text>
  <line x1="160" y1="330" x2="480" y2="330" stroke="#475467" stroke-width="1" opacity="0.4"/>

  <!-- Compute node 1 -->
  <rect x="170" y="360" width="300" height="60" rx="6" ry="6"
        fill="#ffffff" stroke="#475467" stroke-width="1.5"/>
  <text x="320" y="398" text-anchor="middle" font-size="20" fill="#0c1424">
    RA3.XL  ·  1
  </text>
  <!-- Compute node 2 -->
  <rect x="170" y="440" width="300" height="60" rx="6" ry="6"
        fill="#ffffff" stroke="#475467" stroke-width="1.5"/>
  <text x="320" y="478" text-anchor="middle" font-size="20" fill="#0c1424">
    RA3.XL  ·  2
  </text>
  <!-- Compute node 3 -->
  <rect x="170" y="520" width="300" height="60" rx="6" ry="6"
        fill="#ffffff" stroke="#475467" stroke-width="1.5"/>
  <text x="320" y="558" text-anchor="middle" font-size="20" fill="#0c1424">
    RA3.XL  ·  3
  </text>

  <!-- Sublabel below box -->
  <text x="320" y="660" text-anchor="middle" font-size="18" fill="#475467">
    columnar data warehouse
  </text>

  <!-- ============== SERVICE BOX 2: NATIVE VECTOR SEARCH (center) ============== -->
  <rect x="760" y="260" width="400" height="360" rx="12" ry="12"
        fill="#f7f8fb" stroke="#475467" stroke-width="2"/>
  <text x="960" y="310" text-anchor="middle" font-size="26" font-weight="700" fill="#0c1424">
    Native Vector Search
  </text>
  <line x1="800" y1="330" x2="1120" y2="330" stroke="#475467" stroke-width="1" opacity="0.4"/>

  <!-- Vector space: cluster of indigo dots inside a subtle framed region -->
  <rect x="800" y="360" width="320" height="220" rx="6" ry="6"
        fill="#ffffff" stroke="#475467" stroke-width="1" stroke-dasharray="4 4" opacity="0.9"/>
  <!-- Scatter of ~40 indigo dots. r=4, fill indigo w/ varied opacity for depth. -->
  <g fill="#1d4ed8">
    <circle cx="835" cy="395" r="4" opacity="0.85"/>
    <circle cx="870" cy="412" r="4" opacity="0.70"/>
    <circle cx="905" cy="388" r="4" opacity="0.90"/>
    <circle cx="945" cy="405" r="4" opacity="0.60"/>
    <circle cx="985" cy="398" r="4" opacity="0.80"/>
    <circle cx="1020" cy="420" r="4" opacity="0.75"/>
    <circle cx="1060" cy="395" r="4" opacity="0.65"/>
    <circle cx="1095" cy="410" r="4" opacity="0.85"/>

    <circle cx="820" cy="440" r="4" opacity="0.75"/>
    <circle cx="855" cy="455" r="4" opacity="0.90"/>
    <circle cx="895" cy="445" r="4" opacity="0.65"/>
    <circle cx="930" cy="460" r="4" opacity="0.80"/>
    <circle cx="970" cy="448" r="4" opacity="0.95"/>
    <circle cx="1005" cy="465" r="4" opacity="0.70"/>
    <circle cx="1045" cy="452" r="4" opacity="0.85"/>
    <circle cx="1080" cy="438" r="4" opacity="0.60"/>
    <circle cx="1105" cy="460" r="4" opacity="0.75"/>

    <circle cx="830" cy="490" r="4" opacity="0.80"/>
    <circle cx="870" cy="505" r="4" opacity="0.65"/>
    <circle cx="910" cy="495" r="4" opacity="0.90"/>
    <circle cx="945" cy="510" r="4" opacity="0.70"/>
    <circle cx="980" cy="498" r="4" opacity="0.85"/>
    <circle cx="1015" cy="515" r="4" opacity="0.60"/>
    <circle cx="1055" cy="502" r="4" opacity="0.75"/>
    <circle cx="1090" cy="488" r="4" opacity="0.90"/>

    <circle cx="825" cy="540" r="4" opacity="0.70"/>
    <circle cx="860" cy="555" r="4" opacity="0.85"/>
    <circle cx="895" cy="548" r="4" opacity="0.60"/>
    <circle cx="935" cy="562" r="4" opacity="0.95"/>
    <circle cx="975" cy="548" r="4" opacity="0.75"/>
    <circle cx="1010" cy="560" r="4" opacity="0.65"/>
    <circle cx="1050" cy="552" r="4" opacity="0.80"/>
    <circle cx="1085" cy="540" r="4" opacity="0.90"/>
    <circle cx="1105" cy="560" r="4" opacity="0.70"/>

    <!-- a few outliers to break the grid feel -->
    <circle cx="850" cy="375" r="4" opacity="0.55"/>
    <circle cx="1070" cy="380" r="4" opacity="0.60"/>
    <circle cx="820" cy="570" r="4" opacity="0.55"/>
    <circle cx="1100" cy="575" r="4" opacity="0.60"/>
  </g>

  <text x="960" y="660" text-anchor="middle" font-size="18" fill="#475467">
    500K to 50M vectors indexed
  </text>

  <!-- ============== SERVICE BOX 3: AMAZON BEDROCK (right) ============== -->
  <rect x="1400" y="260" width="400" height="360" rx="12" ry="12"
        fill="#f7f8fb" stroke="#475467" stroke-width="2"/>
  <text x="1600" y="310" text-anchor="middle" font-size="26" font-weight="700" fill="#0c1424">
    Amazon Bedrock
  </text>
  <line x1="1440" y1="330" x2="1760" y2="330" stroke="#475467" stroke-width="1" opacity="0.4"/>

  <!-- Foundation model circle (indigo filled, white "FM" text) -->
  <circle cx="1600" cy="475" r="90" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1600" y="490" text-anchor="middle" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="2">
    FM
  </text>
  <text x="1600" y="600" text-anchor="middle" font-size="14" fill="#475467" font-style="italic">
    foundation model
  </text>

  <text x="1600" y="660" text-anchor="middle" font-size="18" fill="#475467">
    embedding and inference
  </text>

  <!-- ============== ARROWS ============== -->
  <!-- Redshift <-> Vector Search. Horizontal line from x=520 to x=760 at y=440. Bidirectional. -->
  <line x1="534" y1="440" x2="746" y2="440"
        stroke="#1d4ed8" stroke-width="2.5"
        marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="640" y="422" text-anchor="middle" font-size="16" fill="#0c1424" font-weight="600">
    SQL + similarity query
  </text>

  <!-- Vector Search <-> Bedrock. Line from x=1160 to x=1400 at y=440. Bidirectional. -->
  <line x1="1174" y1="440" x2="1386" y2="440"
        stroke="#1d4ed8" stroke-width="2.5"
        marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="1280" y="422" text-anchor="middle" font-size="16" fill="#0c1424" font-weight="600">
    embed / rerank
  </text>

  <!-- ============== METRIC CHIPS STRIP (y ~ 780) ============== -->
  <!-- 4 chips evenly spaced across 1920 width. Chip w=380, h=70, gap=40.
       Total = 4*380 + 3*40 = 1640. Left margin = (1920-1640)/2 = 140. -->

  <!-- Chip 1: p95 -->
  <rect x="140" y="780" width="380" height="70" rx="35" ry="35"
        fill="#ecf0f6" stroke="#475467" stroke-width="1.5"/>
  <text x="330" y="825" text-anchor="middle" font-size="24" font-weight="600" fill="#0c1424">
    p95 &lt; 100ms
  </text>

  <!-- Chip 2: vector range -->
  <rect x="560" y="780" width="380" height="70" rx="35" ry="35"
        fill="#ecf0f6" stroke="#475467" stroke-width="1.5"/>
  <text x="750" y="825" text-anchor="middle" font-size="24" font-weight="600" fill="#0c1424">
    500K to 50M vectors
  </text>

  <!-- Chip 3: cost cut -->
  <rect x="980" y="780" width="380" height="70" rx="35" ry="35"
        fill="#ecf0f6" stroke="#475467" stroke-width="1.5"/>
  <text x="1170" y="825" text-anchor="middle" font-size="24" font-weight="600" fill="#0c1424">
    3.2x cost cut
  </text>

  <!-- Chip 4: AUTA winner (BRONZE emphasis) -->
  <rect x="1400" y="780" width="380" height="70" rx="35" ry="35"
        fill="#b88746" stroke="#b88746" stroke-width="1.5"/>
  <text x="1590" y="825" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">
    AUTA winner, 800+ interns
  </text>

  <!-- ============== CAPTION ============== -->
  <text x="960" y="950" text-anchor="middle" font-size="20" fill="#475467">
    Software Engineer (ML) Intern, Summer 2026.  AWS Redshift ML team.
  </text>
</svg>
